name: omr_scanner
description: "MasterJi – OMR sheet checker for teachers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Existing
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.5

  # State & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.2

  # Localisation
  intl: ^0.20.3

  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  generate: true
  uses-material-design: true
