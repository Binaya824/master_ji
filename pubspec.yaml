name: master_ji
descripion: "MasterJi – OMR sheet checker for teachers"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Existing
  cupertino_icons: ^1.0.8
  image_picker: ^1.1.2
  http: ^1.2.2
  path_provider: ^2.1.5
  opencv_dart: ^2.2.2

  # State & Navigation
  provider: ^6.1.2
  go_router: ^14.6.2

  # Storage
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # Localisation
  intl: ^0.20.2

  # Animations
  flutter_animate: ^4.5.0
  animations: ^2.0.11

  # Fonts
  google_fonts: ^6.2.1

  # Utilities
  share_plus: ^10.1.2
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.1
  device_info_plus: ^11.0.0
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

# App launcher icon — matches the splash-screen logo (white document-scanner
# glyph inside a translucent white circle over AppColors.primary teal).
flutter_launcher_icons:
  image_path: assets/icon/masterji_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: assets/icon/masterji_icon_background.png
  adaptive_icon_foreground: assets/icon/masterji_icon_foreground.png

flutter:
  generate: true
  uses-material-design: true
